<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Block Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #crosshair {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: #fff; font-size: 28px; font-weight: bold; text-shadow: 0 0 3px #000; pointer-events: none;
      }
      #hud {
        position: fixed; left: 12px; bottom: 12px; color: #fff; font-size: 15px; line-height: 1.5;
        text-shadow: 0 1px 3px #000; pointer-events: none;
      }
      #pause, #menu {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 20px; cursor: pointer;
      }
      #menu { display: flex; cursor: default; }
      #card {
        background: #fff; color: #222; padding: 28px 32px; border-radius: 8px; width: 260px;
        display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      }
      #card h1 { margin: 0 0 6px; font-size: 22px; }
      #card input { padding: 9px; font-size: 16px; border: 2px solid #bbb; border-radius: 4px; }
      #card input:focus { outline: none; border-color: #41722d; }
      #card button {
        padding: 10px; font-size: 16px; font-weight: bold; color: #fff; background: #41722d;
        border: 0; border-radius: 4px; cursor: pointer;
      }
      #card button:hover { background: #355f24; }
      #error { color: #b00020; font-size: 14px; min-height: 18px; margin: 0; }
      #help { font-size: 13px; color: #555; margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="crosshair">+</div>
    <div id="hud"><div id="hud-name"></div><div id="hud-status"></div></div>
    <div id="pause"></div>
    <div id="menu">
      <div id="card">
        <h1>Simple Block Game</h1>
        <label for="name">Username</label>
        <input id="name" maxlength="16" autocomplete="off" placeholder="Steve" />
        <button id="play">PLAY</button>
        <p id="error"></p>
        <p id="help">WASD move, Space jump, left click break, right click place, ESC unlock mouse.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
